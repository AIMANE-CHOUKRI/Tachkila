<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACHKILA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/app.js" defer></script>
    <link rel="stylesheet" href="src/style.css">
    <!-- <style type="text/tailwindcss"></style> -->
</head>
<body>
    <header class="flex bg-gradient-to-r from-cyan-950 to-indigo-950 justify-between p-3 items-center w-screen">
        <strong class="flex text-nowrap text-white font-sans items-center">
            <span class="bg-green-600 rounded-full mx-2 p-1">&#9917;</span>
            TACHKILA
        </strong>

        <div class="flex-wrap font-bold">
            <span class="mx-2 text-nowrap text-yellow-500">&#9679; GB</span>
            <span class="mx-2 text-nowrap text-blue-500">&#9679; DEF</span>
            <span class="mx-2 text-nowrap text-green-500">&#9679; MIL</span>
            <span class="mx-2 text-nowrap text-red-500">&#9679; ATT</span>
        </div>  

        <b class="text-white font-mono text-nowrap">Schéma <span class="font-mono bg-sky-800 p-2 rounded-lg text-nowrap">4-4-2</span></b> 
    </header>

    <section class="flex lg:flex-row md:flex-col sm:flex-col xs:flex-col w-screen">
        <aside class="flex flex-col lg:w-80 bg-gradient-to-b from-cyan-700 to-indigo-900">
            <button class="bg-green-400 py-3 px-10 my-3 text-white mx-auto rounded-lg text-nowrap" popovertarget="dialogAjout">+ Ajouter un joueur</button>
            <dialog popover id="dialogAjout" class="bg-blue-900 rounded-lg">
                <form class="formAjout flex flex-col p-4 px-4 gap-4 w-80 text-white">
                    <h1 id="h1Ajout">Ajouter un joueur</h1>

                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex. Yassine Bono" class="text-black p-2 rounded-md">

                    <label for="poste">Poste</label>
                    <div class="flex justify-between">
                        <label for="gardien" class="bg-blue-950 w-[49%] p-3 rounded-lg">
                            <input type="radio" name="poste" value="gardien" id="gardien" class="appearance-none checked:border-2 checked:border-yellow-500">&#9679; Gardien
                        </label>
                        <label for="defenseur" class="bg-blue-950 w-[49%] p-3 rounded-lg">
                            <input type="radio" name="poste" value="defenseur" id="defenseur" class="appearance-none checked:border-2 checked:border-yellow-500">&#9679; Défenseur
                        </label>
                    </div>
                    <div class="flex justify-between">
                        <label for="milieu" class="bg-blue-950 w-[49%] p-3 rounded-lg">
                            <input type="radio" name="poste" value="milieu" id="milieu" class="appearance-none checked:border-2 checked:border-yellow-500">&#9679; Milieu
                        </label>
                        <label for="attaquant" class="bg-blue-950 w-[49%] p-3 rounded-lg">
                            <input type="radio" name="poste" value="attaquant" id="attaquant" class="appearance-none checked:border-2 checked:border-yellow-500">&#9679; Attaquant
                        </label>
                    </div>
                    <label for="numero">Numéro (1 à 99)</label>
                    <input type="number" id="numero" name="numero" placeholder="Ex. 7" class="text-black p-2 rounded-md">

                    <span class="flex gap-2 justify-end">
                        <button class="bg-blue-950 rounded-lg w-20 mb-1 h-10" id="btnAnnuler">Annuler</button>
                        <button type="submit" class="bg-green-500 rounded-lg w-20 h-10">Ajouter</button>
                    </span>
                
                </form>                
            </dialog>

            <ul id="listeJoueurs" class="flex flex-col gap-2 px-3 pb-3 max-h-[70vh] overflow-y-auto"></ul>
        </aside>

        <main class="bg-gradient-to-b from-indigo-950 to-gray-950 w-full h-screen justify-items-center align-middle">
                <div class="divGrid  my-3">
                    <div class="row">
                        <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div></div> <div></div> <div></div>
                        <div class="slot bg-cyan-600 flex items-center justify-center border-3 font-bold text-lg text-white">DG</div>
                        <div></div> <div></div>
                        <div class="slot bg-green-600 flex items-center justify-center border-3 font-bold text-lg text-white">MG</div>
                        <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                        <div class="slot bg-red-600 flex items-center justify-center border-3 font-bold text-lg text-white">BU</div>
                    </div>
                    <div class="row">
                        <div class="keeper bg-yellow-600 flex items-center justify-center border-3 font-bold text-2xl text-white">GB</div>
                        <div class="slot bg-cyan-600 flex items-center justify-center border-3 font-bold text-lg text-white">DC</div>
                        <div></div> <div></div>
                        <div class="slot bg-green-600 flex items-center justify-center border-3 font-bold text-lg text-white">MC</div>
                        <div></div> <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div class="start3"></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div class="slot start3 bg-cyan-600 flex items-center justify-center border-3 font-bold text-lg text-white">DC</div>
                        <div></div> <div></div>
                        <div class="slot bg-green-600 flex items-center justify-center border-3 font-bold text-lg text-white">MC</div>
                        <div></div> <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                        <div class="slot bg-red-600 flex items-center justify-center border-3 font-bold text-lg text-white">BU</div>
                    </div>
                    <div class="row">
                        <div></div> <div></div> <div></div>
                        <div class="slot bg-cyan-600 flex items-center justify-center border-3 font-bold text-lg text-white">DD</div>
                        <div></div> <div></div>
                        <div class="slot bg-green-600 flex items-center justify-center border-3 font-bold text-lg text-white">MD</div>
                        <div></div> <div></div> <div></div>
                    </div>
                    <div class="row">
                        <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                    </div>
                </div>
            
        </main>
    </section>
    
</body>
</html>
